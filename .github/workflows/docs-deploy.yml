name: docs-deploy
on:
  workflow_run:
    workflows: [docs-build]
    types: [completed]
permissions:
  contents: read
  deployments: write
  id-token: write
  pull-requests: write
  actions: read
jobs:
  deploy:
    uses: elastic/docs-actions/.github/workflows/docs-deploy.yml@4c0d4482b9b8ca8a3e4f2d99f834cbc7e95974c8 # v1
    with:
      enable-vale-linting: true
